<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ forum.name }}</title>
</head>
<body>
    <h1>{{ forum.name }} Forum</h1>
    <h2>{{ forum.description }}</h2>
    <h3>Created at: {{ forum.created_at }}</h3>
    <h3>Created by: {{ get_user(forum.created_by).username }}</h3>
    <img src="{{ forum.icon_url }}" alt="Icon">
</body>
</html>
