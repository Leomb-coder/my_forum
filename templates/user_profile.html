<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>User Profile</title>
</head>
<body>
<script src="{{ url_for('static', filename='js/user_profile.js') }}" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <div class="container-fluid">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">Logo</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                        <!-- User profile Dropdown -->
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" aria-expanded="false" data-bs-toggle="dropdown">
                                <img src="{{ user.pfp_url }}" class="me-2" alt="Avatar" width="35" height="35">
                                <span class="d-none d-md-inline text-white">{{ user.username }}</span>
                            </a>
                            <!-- Dropdown menu items -->
                            <ul class="dropdown-menu dropdown-menu-end shadow">
                                <li><a class="dropdown-menu-item p-2 d-block text-decoration-none text-white" href="#" id="profile-link">My Profile</a></li>
                                <li><a class="dropdown-menu-item p-2 d-block text-decoration-none text-white" href="#" id="logout-link">Logout</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Profile Container -->
        <div class="container-fluid bg-body-secondary p-4">
            <div class="row">
                <div class="col-auto">
                    <img src="{{ user.pfp_url }}" alt="Avatar" class="me-2" height="250" width="250">
                </div>
                <div class="col">
                    <!--
                    <form id="change-profile-picture">
                        <h3>Change Profile Picture</h3>
                        <label>
                            Image URL:
                            <br><input type="url" name="pfp_url">
                        </label>
                        <br><br>
                        <button type="submit">Submit</button>
                    </form>
                    -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
